name: Build-and-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - id: dockerx
        name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - id: build
        name: Build dev docker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: pragent/pr-agent:test
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
          target: test

      - id: test
        name: Test dev docker
        run: |
          docker run --name test_container pragent/pr-agent:test pytest -v tests/unittest --cov=pr_agent --cov-report term --cov-report xml:coverage.xml
          docker cp test_container:/app/coverage.xml coverage.xml
          docker rm test_container

      - name: Validate coverage report
        run: |
          if [ ! -f coverage.xml ]; then
            echo "Coverage report not found"
            exit 1
          fi
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe  # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Unit tests override CMD, so a broken server launcher never fails CI.
      # Smoke-start github_app (gunicorn + uvicorn) with no secrets; GET / → 200.
      - id: build-smoke
        name: Build github_app docker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: pragent/pr-agent:smoke
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
          target: github_app

      - id: smoke
        name: Smoke-start the github_app container
        run: |
          docker run -d --name pr-agent-smoke -p 3000:3000 pragent/pr-agent:smoke
          for _ in $(seq 1 15); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "container is serving"
              docker rm -f pr-agent-smoke
              exit 0
            fi
            sleep 2
          done
          echo "container did not come up"
          docker logs pr-agent-smoke
          docker rm -f pr-agent-smoke
          exit 1

  # The job above runs entirely inside docker/Dockerfile, whose base is pinned
  # to python:3.12.14-slim, so nothing exercised the upper half of pyproject's
  # `requires-python = ">=3.12"` -- including the google-cloud-storage pin that
  # only applies at python_version >= '3.13'. Installing from PyPI on 3.13 was
  # therefore an untested combination. Deliberately a separate job rather than a
  # matrix over the docker build: the shipped images are 3.12 on purpose, and
  # matrixing would rebuild every layer and re-run the smoke test and coverage
  # upload for no extra signal.
  unit-tests-py313:
    name: Unit tests (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Same uv release the Dockerfile pulls from ghcr.io/astral-sh/uv, via pipx
      # so there is no additional action to pin. uv provisions the interpreter
      # itself, so setup-python is not needed either.
      - id: uv
        name: Install uv
        run: pipx install uv==0.12.10

      - id: test-py313
        name: Test on Python 3.13
        env:
          PYTHONPATH: .
        run: uv run --frozen --python 3.13 pytest -v tests/unittest
